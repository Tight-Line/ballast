name: Snyk Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC

permissions:
  contents: read

jobs:
  snyk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # upload Snyk SARIF to code scanning
    env:
      # Empty on Dependabot/fork runs, which get no access to Actions secrets.
      # Go dependency bumps are still gated by the tokenless govulncheck job in
      # ci.yml; Snyk runs fully on trusted PRs, on push to main, and on schedule.
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          # release-assets.githubusercontent.com is where actions/setup-go fetches
          # the Go toolchain. Without it this job died in the setup step and never
          # reached the scan, so a red "Snyk Security" check meant "could not run",
          # not "found vulnerabilities". See the same note on ci.yml's lint job.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            release-assets.githubusercontent.com:443
            api.snyk.io:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run Snyk to check for vulnerabilities
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/golang@11b673cfb4b0dc0d860a1323caa199d54950dcce # master
        with:
          args: --severity-threshold=high

      - name: Upload Snyk results to GitHub Code Scanning
        if: ${{ always() && hashFiles('snyk.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: snyk.sarif
        continue-on-error: true
