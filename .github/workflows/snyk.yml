name: Snyk Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC

permissions:
  contents: read

jobs:
  snyk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # upload Snyk SARIF to code scanning
    env:
      # Empty on Dependabot/fork runs, which get no access to Actions secrets.
      # Go dependency bumps are still gated by the tokenless govulncheck job in
      # ci.yml; Snyk runs fully on trusted PRs, on push to main, and on schedule.
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          # release-assets.githubusercontent.com is where actions/setup-go fetches
          # the Go toolchain. Without it this job died in the setup step and never
          # reached the scan, so a red "Snyk Security" check meant "could not run",
          # not "found vulnerabilities". See the same note on ci.yml's lint job.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            release-assets.githubusercontent.com:443
            api.snyk.io:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Run Snyk to check for vulnerabilities
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/golang@11b673cfb4b0dc0d860a1323caa199d54950dcce # master
        with:
          args: --severity-threshold=high

      - name: Upload Snyk results to GitHub Code Scanning
        if: ${{ always() && hashFiles('snyk.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: snyk.sarif
        continue-on-error: true
