name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  release-image:
    name: Build and push container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless cosign signing + provenance (GitHub OIDC)
      attestations: write   # actions/attest-build-provenance

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudfront.docker.com:443
            gcr.io:443
            *.githubapp.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          TAG=${GITHUB_REF#refs/tags/}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      # Single multi-arch build. The Dockerfile cross-compiles (builder runs on
      # the native runner via --platform=$BUILDPLATFORM), so arm64 is fast and
      # there is no separate amd64-first push — the tags are only ever set once,
      # by this build, which is the one that gets signed below (no unsigned window).
      - name: Build and push ballast
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.VERSION }}
          tags: |
            ${{ steps.meta.outputs.IMAGE_PREFIX }}/ballast:${{ steps.meta.outputs.TAG }}
            ${{ steps.meta.outputs.IMAGE_PREFIX }}/ballast:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the pushed image, attest an SBOM, and attach SLSA build provenance —
      # all keyless via GitHub OIDC + sigstore, written to GHCR as OCI artifacts
      # so consumers can `cosign verify` / `cosign verify-attestation` the image.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        env:
          IMAGE: ${{ steps.meta.outputs.IMAGE_PREFIX }}/ballast
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.meta.outputs.IMAGE_PREFIX }}/ballast@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          # Do not attach the SBOM as a GitHub release asset. It defaults to true
          # and now finds the v<tag> release (created by the release-chart job) and
          # tries to upload, which needs contents: write — this job is deliberately
          # contents: read. The SBOM is attested into the OCI referrers store below
          # (actions/attest-sbom) and kept as a workflow artifact, so the release
          # asset would be redundant anyway.
          upload-release-assets: false

      # Attest the SBOM via actions/attest-sbom so it lands in the OCI referrers
      # store, the same place actions/attest-build-provenance writes, rather than
      # the legacy cosign `.att` tag. Keeps SBOM + provenance discoverable by the
      # same `cosign verify-attestation` / `gh attestation verify` commands.
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.meta.outputs.IMAGE_PREFIX }}/ballast
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.meta.outputs.IMAGE_PREFIX }}/ballast
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release-chart:
    name: Package and publish Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the per-tag GitHub release (gh CLI)
      packages: write       # push the chart as an OCI artifact to GHCR
      id-token: write       # keyless cosign signing + provenance (GitHub OIDC)
      attestations: write   # actions/attest-build-provenance

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            release-assets.githubusercontent.com:443
            get.helm.sh:443
            valkey-io.github.io:443
            valkey.io:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            objects.githubusercontent.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Add Helm repositories
        run: |
          helm repo add valkey https://valkey-io.github.io/valkey-helm/
          helm repo update

      - name: Update Helm dependencies
        run: helm dependency update charts/ballast

      # crds/ is a build artifact (gitignored since it's synced from
      # config/crd/bases/), so a fresh checkout doesn't have it. Without this
      # step the published package ships no CRDs and a first install on a bare
      # cluster fails validation ("ensure CRDs are installed first") before the
      # pre-install CRD hook ever runs. Mirrors the `helm-build` Make target,
      # minus the Go toolchain it would pull in via `manifests`.
      - name: Sync CRDs into the chart
        run: |
          mkdir -p charts/ballast/crds
          cp config/crd/bases/*.yaml charts/ballast/crds/

      # Publish the chart as a signed OCI artifact to GHCR. This is now the only
      # published Helm repo: the former GitHub Pages repo
      # (`helm repo add ballast https://tight-line.github.io/ballast`) is frozen
      # at its last chart-releaser version and no longer receives new releases
      # (see the breaking-change note in CHANGELOG). Consumers install via
      # `helm install oci://ghcr.io/<owner>/charts/ballast` and can `cosign
      # verify` the chart. Keyless via GitHub OIDC + sigstore.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Package and push chart (OCI)
        id: oci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm package charts/ballast --destination .cr-oci
          chart_tgz="$(ls .cr-oci/ballast-*.tgz)"
          # pipefail makes a failed `helm push` fail this step (instead of the
          # pipe to tee masking it and leaving an empty digest for cosign).
          helm push "$chart_tgz" "oci://ghcr.io/${owner}/charts" 2>&1 | tee push.log
          digest="$(grep -oiE 'sha256:[0-9a-f]{64}' push.log | head -1)"
          if [ -z "$digest" ]; then
            echo "::error::could not determine pushed chart digest"; cat push.log; exit 1
          fi
          echo "ref=ghcr.io/${owner}/charts/ballast" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "tgz=${chart_tgz}" >> "$GITHUB_OUTPUT"

      - name: Sign chart (keyless)
        env:
          REF: ${{ steps.oci.outputs.ref }}
          DIGEST: ${{ steps.oci.outputs.digest }}
        run: cosign sign --yes "${REF}@${DIGEST}"

      - name: Attest chart build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.oci.outputs.ref }}
          subject-digest: ${{ steps.oci.outputs.digest }}
          push-to-registry: true

      # chart-releaser used to create the per-tag GitHub release; recreate it
      # with the gh CLI (already on the runner, no third-party action) so each
      # tag still gets a release with auto-generated notes and the packaged
      # chart attached as a convenience download. The signed OCI chart above is
      # the canonical artifact; this asset is a courtesy copy.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TGZ: ${{ steps.oci.outputs.tgz }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          # Idempotent: re-running an existing tag must not fail the job.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag already exists; uploading chart asset"
            gh release upload "$tag" "$TGZ" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$TGZ" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --generate-notes
          fi
