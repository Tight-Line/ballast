name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; no job here needs write access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Empty on Dependabot/fork runs, which get no access to Actions secrets.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            cli.codecov.io:443
            ingest.codecov.io:443
            *.ingest.us.sentry.io:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests and check coverage
        run: make test-coverage-check

      # The coverage gate above always runs; the upload is telemetry, so it
      # skips (rather than fails) when no token is available.
      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' && hashFiles('coverage.filtered.out') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.filtered.out
          fail_ci_if_error: false
          token: ${{ env.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # actions/setup-go fetches the toolchain from the actions/go-versions
          # release, which redirects to release-assets.githubusercontent.com. The
          # download only happens when the runner image does not already ship the
          # Go version in go.mod, so a missing endpoint here stays invisible until
          # the pinned Go moves ahead of the image, which is what broke this job.
          #
          # Chart checks: get.helm.sh serves the Helm binary; valkey-io.github.io
          # redirects to valkey.io for the valkey subchart index, whose tarball
          # comes from github.com release assets (already allowed). helm-unittest
          # is go-installed, so it only needs the Go module endpoints above.
          allowed-endpoints: >
            github.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            release-assets.githubusercontent.com:443
            get.helm.sh:443
            valkey-io.github.io:443
            valkey.io:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run lint
        run: make lint

      # Pinned so chart lint/tests are reproducible; downloads from get.helm.sh.
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.1

      - name: Lint and unit-test the Helm chart
        run: make helm-lint helm-test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # release-assets.githubusercontent.com: see the note on the lint job.
          allowed-endpoints: >
            github.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: make build

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # release-assets.githubusercontent.com: see the note on the lint job.
          allowed-endpoints: >
            github.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            release-assets.githubusercontent.com:443
            vuln.go.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Tokenless, symbol-level vulnerability scan against vuln.go.dev. Runs on
      # every CI run, including Dependabot/fork PRs that cannot see secrets, so
      # dependency bumps still get a real vuln gate. Pinned via the `tool`
      # directive in go.mod (kept current by Dependabot) for reproducibility.
      - name: Run govulncheck
        run: go tool govulncheck ./...
