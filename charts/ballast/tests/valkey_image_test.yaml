suite: valkey image defaults
templates:
  - charts/valkey/templates/deploy_valkey.yaml
  # deploy_valkey.yaml includes these for its config checksums
  - charts/valkey/templates/init_config.yaml
  - charts/valkey/templates/configmap.yaml
release:
  name: ballast
  namespace: ballast-system
tests:
  - it: defaults to the Alpine Valkey image
    template: charts/valkey/templates/deploy_valkey.yaml
    asserts:
      - isKind: {of: Deployment}
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/valkey/valkey:9.1.3-alpine
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: docker.io/valkey/valkey:9.1.3-alpine
  - it: image.tag remains overridable
    template: charts/valkey/templates/deploy_valkey.yaml
    set: {valkey.image.tag: "9.1.3"}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/valkey/valkey:9.1.3
