suite: cluster reachable, default StorageClass (GA annotation), existing 10Gi PVC
templates:
  - templates/valkey-storage-guard.yaml
release:
  name: ballast
  namespace: ballast-system
kubernetesProvider:
  scheme:
    "v1/Namespace": {gvr: {version: v1, resource: namespaces}, namespaced: false}
    "storage.k8s.io/v1/StorageClass": {gvr: {group: storage.k8s.io, version: v1, resource: storageclasses}, namespaced: false}
    "v1/PersistentVolumeClaim": {gvr: {version: v1, resource: persistentvolumeclaims}, namespaced: true}
  objects:
    - {kind: Namespace, apiVersion: v1, metadata: {name: kube-system}}
    - kind: StorageClass
      apiVersion: storage.k8s.io/v1
      metadata:
        name: gp3
        annotations: {storageclass.kubernetes.io/is-default-class: "true"}
      provisioner: ebs.csi.aws.com
      allowVolumeExpansion: true
    - kind: PersistentVolumeClaim
      apiVersion: v1
      metadata: {name: ballast-valkey, namespace: ballast-system}
      spec: {accessModes: [ReadWriteOnce], storageClassName: gp3, resources: {requests: {storage: 192Mi}}}
      status: {phase: Bound, capacity: {storage: 10Gi}}
tests:
  - it: fails at default 1Gi and names the exact value
    asserts:
      - failedTemplate:
          errorPattern: "requestedSize \\(1Gi\\) is smaller than the capacity \\(10Gi\\) of the existing PersistentVolumeClaim ballast-system/ballast-valkey.*--set valkey.dataStorage.requestedSize=10Gi"
  - it: passes when the request equals the capacity
    set: {valkey.dataStorage.requestedSize: 10Gi}
    asserts:
      - hasDocuments: {count: 0}
  - it: passes when the request is above the capacity
    set: {valkey.dataStorage.requestedSize: 20Gi}
    asserts:
      - hasDocuments: {count: 0}
  - it: compares across unit systems (10Gi > 10G)
    set: {valkey.dataStorage.requestedSize: 10G}
    asserts:
      - failedTemplate:
          errorPattern: "requestedSize=10Gi"
  - it: looks up the claim under valkey.fullnameOverride
    set: {valkey.fullnameOverride: other-store}
    asserts:
      - hasDocuments: {count: 0}
  - it: skips when the subchart does not own the PVC
    set: {valkey.dataStorage.persistentVolumeClaimName: byo-claim}
    asserts:
      - hasDocuments: {count: 0}
